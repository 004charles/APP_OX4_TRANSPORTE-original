<!DOCTYPE html>
<html lang="pt">
<head>
	<meta charset="utf-8">
	<meta name="theme-color" content="#ffffff">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>OX4 Transportes - App de Transporte Urbano</title>
	<link rel="icon" href="assets/images/favicon/icon.png">
	<link href="../../../../../fonts.googleapis.com/css2%3Ffamily=League+Spartan:wght@100..900&amp;display=swap.css" rel="stylesheet">
	<link href="../../../../../fonts.googleapis.com/css2%3Ffamily=Space+Grotesk:wght@300..700&amp;display=swap.css" rel="stylesheet">
	<link rel="stylesheet" href="assets/css/all.min.css">
	<link rel="stylesheet" href="assets/css/slick.css">
	<link rel="stylesheet" href="assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="assets/css/style.css">
	<link rel="stylesheet" href="assets/css/media-query.css">
	<link rel="manifest" href="manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log('Service Worker registrado'))
      .catch(err => console.log(err));
  }
</script>
</head>
<body>
	<div class="site-content">
		<!-- Preloader início -->
		<div class="loader-mask">
			<div class="loading-window">
				<div class="car">
					<div class="strike"></div>
					<div class="strike strike2"></div>
					<div class="strike strike3"></div>
					<div class="strike strike4"></div>
					<div class="strike strike5"></div>
					<div class="car-detail spoiler"></div>
					<div class="car-detail back"></div>
					<div class="car-detail center"></div>
					<div class="car-detail center1"></div>
					<div class="car-detail front"></div>
					<div class="car-detail wheel"></div>
					<div class="car-detail wheel wheel2"></div>
				</div>
			</div>
		</div>
		<!-- Preloader fim -->
		<!-- Cabeçalho início -->
		<header id="top-header">
			<div class="header-wrap">
				<div class="header-back">
					<a href="javascript:history.go(-1)">
						<img src="assets/svg/back-btn-white.svg" alt="botão-voltar">
					</a>
				</div>
				<div class="header-name">
					<p>Contate-nos</p>
				</div>
			</div>
			<div class="boder"></div>
		</header>
		<!-- Cabeçalho fim -->
		<!-- Conteúdo da tela Contate-nos início -->
		<section id="contact-us">
			<div class="container">
				<div class="enable-location-wrap mt-24">
					<div class="enable-img">
						<img src="assets/images/contact-us/contact-us-img.png" alt="imagem-contato">
					</div>
					<div class="enable-details mt-32">
						<h1>Contate-nos</h1>
						<p class="sm-txt mt-16">Se você tiver qualquer problema com nossos serviços de transporte, entre em contato conosco.</p>
					</div>
					<div class="benefits-details benefits-details1 mt-32">
						<div class="benefit-icon">
							<img src="assets/images/contact-us/call-icon.svg" alt="ícone-telefone">
						</div>
						<div class="benefit-content">
							<a href="tel:+5521999999999">
								<p class="no.txt">+244 931 353 538</p>
							</a>
						</div>
					</div>
					<div class="benefits-details mt-8">
						<div class="benefit-icon">
							<img src="assets/images/contact-us/message-icon.svg" alt="ícone-email">
						</div>
						<div class="benefit-content">
							<a href="mailto:suporte@ox4transportes.com">
								<p class="no.txt">suporte@ox4transportes.com</p>
							</a>
						</div>
					</div>
				</div>
			</div>
		</section>
		<!-- Conteúdo da tela Contate-nos fim -->
	</div>
	<script src="assets/js/jquery.min.js"></script>
	<script src="assets/js/slick.min.js"></script>
	<script src="assets/js/bootstrap.bundle.min.js"></script>
	<script src="assets/js/custom.js"></script>
</body>
</html>
