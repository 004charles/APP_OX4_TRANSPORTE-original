<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
    <meta name="theme-color" content="#ffffff">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OX4 Transportes - Aplicativo Móvel de Reserva de Táxi</title>
  <link rel="icon" href="assets/images/favicon/icon.png">
  <link href="../../../../../fonts.googleapis.com/css2%3Ffamily=League+Spartan:wght@100..900&amp;display=swap.css" rel="stylesheet">
  <link href="../../../../../fonts.googleapis.com/css2%3Ffamily=Space+Grotesk:wght@300..700&amp;display=swap.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/all.min.css">
  <link rel="stylesheet" href="assets/css/slick.css">
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/intlTelInput.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/media-query.css">
  <link rel="manifest" href="manifest.json">
<style>
  .sign-in-password-btn a,
  .block-footer  a {
    border-color: #2e3f6e !important;
  }
  .sign-in-password-btn a:hover,
  .block-footer a:hover {
    background-color: #24325a !important;
    border-color: #24325a !important;
  }
</style>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log('Service Worker registrado'))
      .catch(err => console.log(err));
  }
</script>

</head>
<body>
  <div class="site-content">
    <!-- Preloader start -->
    <div class="loader-mask">
      <div class="loading-window">
        <div class="car">
          <div class="strike"></div>
          <div class="strike strike2"></div>
          <div class="strike strike3"></div>
          <div class="strike strike4"></div>
          <div class="strike strike5"></div>
          <div class="car-detail spoiler"></div>
          <div class="car-detail back"></div>
          <div class="car-detail center"></div>
          <div class="car-detail center1"></div>
          <div class="car-detail front"></div>
          <div class="car-detail wheel"></div>
          <div class="car-detail wheel wheel2"></div>
        </div>
      </div>
    </div>
    <!-- Preloader end -->
    <!-- Tela de login content start -->
    <div class="let-you-page-main">
      <div class="let-you-top" >
        <div class="let-you-top-wrap">
          <header class="back-btn">
  <a href="javascript:history.go(-1)">
    <img src="assets/svg/back-btn-arrow.svg" alt="botão-voltar" style="filter: invert(22%) sepia(89%) saturate(1178%) hue-rotate(199deg) brightness(89%) contrast(95%);">
  </a>
</header>
          <div class="taxi-img_main">
            <img style="width: 90px;" class="taxi-img_img" src="assets/images/Logotipo 1.png" alt="logo">
          </div>
        </div>
      </div>
      <div class="let-you-social-sec">
        <div class="lets_you_in_box">
          <h1 class="d-none">hidden</h1>
          <h2 class="lets_you_in_text">Entrar</h2>
          <form>
            <div class="mobile-form mt-32">
              <input type="number" id="mobile_code" class="sign-in-custom-input" placeholder="Número de telefone">
            </div>

          </form>
          <div class="sign-in-password-btn mt-32">
            <a style="background-color: #24325a; color: white;" href="verify-number.html">Entrar</a>
          </div>
          <div class="or-section mt-32">
            <p>ou continue com</p>
          </div>
          <div class="icons_main mt-32">
            
            <a href="https://www.google.com" target="_blank">
              <img class="icons" src="assets/images/let-you-screen/google-icon.svg" alt="Icone-google">
            </a>
            
            <a href="https://wa.me/+12345678899" target="_blank">
              <img class="icons" src="assets/images/let-you-screen/whatsapp.svg" alt="Icone-whatsapp">
            </a>
          </div>
        </div>
      </div>
      <footer id="let-you-footer">
        <div class="block-footer">
          <p>Não tem uma conta? <a style="color: #24325a;" href="sign-up.html">Cadastre-se</a></p>
        </div>
      </footer>
    </div>
    <!-- Tela de login content end -->
  </div>
  <script src="assets/js/jquery.min.js"></script>
  <script src="assets/js/slick.min.js"></script>
  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/intlTelInput.min.js"></script>
  <script src="assets/js/flag.js"></script>
  <script src="assets/js/custom.js"></script>
</body>
</html>
