<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#ffffff">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OX4 Transportes - App de Transporte Urbano</title>
  <link rel="icon" href="assets/images/favicon/icon.png">
  <link href="../../../../../fonts.googleapis.com/css2%3Ffamily=League+Spartan:wght@100..900&amp;display=swap.css" rel="stylesheet">
  <link href="../../../../../fonts.googleapis.com/css2%3Ffamily=Space+Grotesk:wght@300..700&amp;display=swap.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/all.min.css">
  <link rel="stylesheet" href="assets/css/slick.css">
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/media-query.css">
  <link rel="manifest" href="manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log('Service Worker registrado'))
      .catch(err => console.log(err));
  }
</script>
</head>
<body>
  <div class="site-content">
    <!-- Preloader início -->
    <div class="loader-mask">
      <div class="loading-window">
        <div class="car">
          <div class="strike"></div>
          <div class="strike strike2"></div>
          <div class="strike strike3"></div>
          <div class="strike strike4"></div>
          <div class="strike strike5"></div>
          <div class="car-detail spoiler"></div>
          <div class="car-detail back"></div>
          <div class="car-detail center"></div>
          <div class="car-detail center1"></div>
          <div class="car-detail front"></div>
          <div class="car-detail wheel"></div>
          <div class="car-detail wheel wheel2"></div>
        </div>
      </div>
    </div>
    <!-- Preloader fim -->
    <!-- Cabeçalho início -->
    <header id="top-header">
      <div class="header-wrap">
        <div class="header-back">
          <a href="javascript:history.go(-1)">
            <img src="assets/svg/back-btn-white.svg" alt="botão-voltar">
          </a>
        </div>
        <div class="header-name">
          <p>Idioma Preferido</p>
        </div>
      </div>
      <div class="boder"></div>
    </header>
    <!-- Cabeçalho fim -->
    <!-- Conteúdo da tela de idioma preferido início -->
    <section id="preferred-language">
      <div class="container">
        <div class="pre-lanuage-top mt-32">
          <h1 class="hey-txt">Olá, Jessica</h1>
          <p class="select-lang mt-16">Por favor, selecione seu idioma preferido para facilitar a comunicação.</p>
          <form class="select-lang-sec mt-32">
            <div class="lang-sec">
              <input type="radio" id="select-lang1" name="select-language" checked>
              <label class="custom-radio-sel-lang" for="select-lang1">Português (Brasil)</label>
            </div>
            <div class="lang-sec">
              <input type="radio" id="select-lang2" name="select-language">
              <label class="custom-radio-sel-lang" for="select-lang2">Inglês</label>
            </div>
            <div class="lang-sec">
              <input type="radio" id="select-lang3" name="select-language">
              <label class="custom-radio-sel-lang" for="select-lang3">Espanhol</label>
            </div>
            <div class="lang-sec">
              <input type="radio" id="select-lang4" name="select-language">
              <label class="custom-radio-sel-lang" for="select-lang4">Francês</label>
            </div>
            <div class="lang-sec">
              <input type="radio" id="select-lang5" name="select-language">
              <label class="custom-radio-sel-lang" for="select-lang5">Alemão</label>
            </div>
            <div class="lang-sec">
              <input type="radio" id="select-lang6" name="select-language">
              <label class="custom-radio-sel-lang" for="select-lang6">Italiano</label>
            </div>
            <div class="lang-sec">
              <input type="radio" id="select-lang7" name="select-language">
              <label class="custom-radio-sel-lang" for="select-lang7">Japonês</label>
            </div>
            <div class="lang-sec">
              <input type="radio" id="select-lang8" name="select-language">
              <label class="custom-radio-sel-lang" for="select-lang8">Chinês</label>
            </div>
            <div class="lang-sec">
              <input type="radio" id="select-lang9" name="select-language">
              <label class="custom-radio-sel-lang" for="select-lang9">Russo</label>
            </div>
          </form>
        </div>
        <div class="pre-lanuage-bottom">
          <div class="finger-print-bottom-wrap">
            <div class="skip-btn-print">
              <a href="account-created.html">Pular</a>
            </div>
            <div class="continue-btn">
              <a href="enable-location-screen.html">Próximo</a>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- Conteúdo da tela de idioma preferido fim -->
  </div>
  <script src="assets/js/jquery.min.js"></script>
  <script src="assets/js/slick.min.js"></script>
  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/custom.js"></script>
</body>
</html>
