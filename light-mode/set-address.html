<!DOCTYPE html>
<html lang="pt">
<head>
	<meta charset="utf-8">
	<meta name="theme-color" content="#ffffff">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>OX4 Transportes - App de Transporte Urbano</title>
	<link rel="icon" href="assets/images/favicon/icon.png">
	<link href="../../../../../fonts.googleapis.com/css2%3Ffamily=League+Spartan:wght@100..900&amp;display=swap.css" rel="stylesheet">
	<link href="../../../../../fonts.googleapis.com/css2%3Ffamily=Space+Grotesk:wght@300..700&amp;display=swap.css" rel="stylesheet">
	<link rel="stylesheet" href="assets/css/all.min.css">
	<link rel="stylesheet" href="assets/css/slick.css">
	<link rel="stylesheet" href="assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="assets/css/style.css">
	<link rel="stylesheet" href="assets/css/media-query.css">
	<link rel="manifest" href="manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log('Service Worker registrado'))
      .catch(err => console.log(err));
  }
</script>
</head>
<body>
	<div class="site-content">
		<!-- Preloader início -->
		<div class="loader-mask">
			<div class="loading-window">
				<div class="car">
					<div class="strike"></div>
					<div class="strike strike2"></div>
					<div class="strike strike3"></div>
					<div class="strike strike4"></div>
					<div class="strike strike5"></div>
					<div class="car-detail spoiler"></div>
					<div class="car-detail back"></div>
					<div class="car-detail center"></div>
					<div class="car-detail center1"></div>
					<div class="car-detail front"></div>
					<div class="car-detail wheel"></div>
					<div class="car-detail wheel wheel2"></div>
				</div>
			</div>
		</div>
		<!-- Preloader fim -->
		<!-- Cabeçalho início -->
		<header id="top-header">
			<div class="header-wrap">
				<div class="header-back">
					<a href="javascript:history.go(-1)">
						<img src="assets/svg/back-btn-white.svg" alt="botão-voltar">
					</a>
				</div>
				<div class="header-name">
					<p>Definir Localização</p>
				</div>
			</div>
			<div class="boder"></div>
		</header>
		<!-- Cabeçalho fim -->
		<!-- Conteúdo da tela de definir endereço início -->
		<section id="add-new-add">
			<div class="container">
				<div class="add-new-add-wrap">
					<h1 class="d-none">Oculto</h1>
					<div class="add-map mt-24">
						<img src="assets/images/map/add-address-img.png" alt="ícone-endereço">	
					</div>
					<form class="map-section-form mt-24">
						<div class="title-sec">
							<label for="title">NOME DO LOCAL</label>
							<input type="text" value="Casa" id="title" class="mt-8" placeholder="Ex: Casa, Trabalho, Academia">
						</div>
						<div class="title-sec mt-16">
							<label for="address">ENDEREÇO COMPLETO</label>
							<input type="text" value="Avenida Paulista, 1000 - São Paulo/SP" id="address" class="mt-8" placeholder="Digite o endereço completo">
						</div>
						<div class="footer-checkbox-sec mt-16">
							<input class="checkbox-input-add" id="footer-checkbox" type="checkbox">
							<label for="footer-checkbox" class="footer-chec-txt1">Definir como endereço padrão</label>
						</div>
					</form>
					<div class="verify-number-btn">
						<a href="account-created.html">Continuar</a>
					</div>
				</div>	
			</div>
		</section>
		<!-- Conteúdo da tela de definir endereço fim -->
	</div>
	<script src="assets/js/jquery.min.js"></script>
	<script src="assets/js/slick.min.js"></script>
	<script src="assets/js/bootstrap.bundle.min.js"></script>
	<script src="assets/js/custom.js"></script>
</body>
</html>
